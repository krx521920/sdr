name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mcp_server/**'
      - 'docker/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.docker'
      - '.coveragerc'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mcp_server/**'
      - 'docker/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.docker'
      - '.coveragerc'
      - '.github/workflows/tests.yml'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            postgresql-client \
            shared-mime-info

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --frozen

      # The suite runs with --no-migrations for speed, so nothing else would
      # catch a model change that is missing its migration.
      - name: Check for missing migrations
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: crm.test_settings
          SECRET_KEY: test-secret-key-for-ci
          ADMIN_EMAIL: admin@test.com
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: crm.test_settings
          SECRET_KEY: test-secret-key-for-ci
          ADMIN_EMAIL: admin@test.com
        run: uv run pytest -m "not postgres_only" --tb=short -v

      - name: Create PostgreSQL acceptance database and RLS role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE crm_ci WITH LOGIN PASSWORD 'crm_ci_password' CREATEDB NOSUPERUSER NOBYPASSRLS;"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE crm_acceptance OWNER crm_ci;"

      - name: Apply migrations and verify PostgreSQL RLS
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: crm.settings
          SECRET_KEY: test-secret-key-for-ci
          ADMIN_EMAIL: admin@test.com
          DBNAME: crm_acceptance
          DBUSER: crm_ci
          DBPASSWORD: crm_ci_password
          DBHOST: 127.0.0.1
          DBPORT: '5432'
          PGPASSWORD: crm_ci_password
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py migrate --check
          uv run python manage.py manage_rls --verify-user --no-color

          rls_status="$(uv run python manage.py manage_rls --status --no-color)"
          printf '%s\n' "$rls_status"
          if printf '%s\n' "$rls_status" | grep -Eqi 'TABLE NOT FOUND|: disabled$'; then
            echo 'RLS status contains an unsafe or incomplete table state.' >&2
            exit 1
          fi
          printf '%s\n' "$rls_status" | grep -Eq 'Enabled: [1-9][0-9]*, Disabled: 0'

          role_flags="$(psql -h 127.0.0.1 -U crm_ci -d crm_acceptance -At \
            -c "SELECT rolsuper::int || '|' || rolbypassrls::int FROM pg_roles WHERE rolname = current_user;")"
          test "$role_flags" = '0|0'

      - name: Run PostgreSQL-only isolation tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: crm.settings
          SECRET_KEY: test-secret-key-for-ci
          ADMIN_EMAIL: admin@test.com
          DBNAME: crm_acceptance
          DBUSER: crm_ci
          DBPASSWORD: crm_ci_password
          DBHOST: 127.0.0.1
          DBPORT: '5432'
          SECURE_SSL_REDIRECT: 'False'
        run: uv run pytest -m postgres_only --no-cov --tb=short -v

      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: backend
        run: uvx --from "genbadge[coverage]" genbadge coverage -i coverage.xml -o ../coverage-badge.svg

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add coverage-badge.svg || true
          git diff --staged --quiet || git commit -m "Update coverage badge [skip ci]"
          git push || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/
          retention-days: 14

  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Security tests
        working-directory: frontend
        run: pnpm test

      - name: Prettier format check
        continue-on-error: true
        working-directory: frontend
        run: pnpm prettier --check .

      - name: ESLint
        working-directory: frontend
        run: pnpm eslint .

      - name: Type check (svelte-check)
        working-directory: frontend
        run: pnpm check

      - name: Build
        working-directory: frontend
        run: pnpm build

  mcp-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'mcp_server/uv.lock'

      - name: Install MCP dependencies
        working-directory: mcp_server
        run: uv sync --frozen

      - name: Run MCP tests
        working-directory: mcp_server
        run: uv run pytest --tb=short -v
