services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-rls-user.sql:/docker-entrypoint-initdb.d/init-rls-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    environment:
      STATIC_ROOT: /tmp/staticfiles
      MEDIA_ROOT: /tmp/media
      SERVER_LOG_PATH: /tmp/server.log
      SECURITY_AUDIT_LOG_PATH: /tmp/security_audit.log
    volumes:
      - ./backend:/app
      - ./docker/backend/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request = urllib.request.Request(
          'http://127.0.0.1:8000/healthz/',
          headers={'X-Forwarded-Proto': 'https'});
          assert urllib.request.urlopen(request, timeout=5).status == 200
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /bin/bash /entrypoint.sh

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: >-
      celery -A crm worker --loglevel=info --queues=celery,default
      --concurrency=${CELERY_WORKER_CONCURRENCY:-4}

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A crm beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"

volumes:
  postgres_data:
  frontend_node_modules:
